<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2f6bff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="健身打卡">
<meta name="description" content="按周计划打卡健身，记录重量和备注">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>健身打卡</title>
<style>
  :root{
    --bg:#f4f5f8; --card:#ffffff; --text:#1f2430; --muted:#8b93a5;
    --line:#e8eaf0; --accent:#2f6bff; --done:#c2c8d6; --danger:#ff5a5f;
    --soft:#f7f8fb;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    font-size:16px; line-height:1.5;
    padding:calc(env(safe-area-inset-top) + 14px) 14px calc(env(safe-area-inset-bottom) + 40px);
    max-width:560px; margin:0 auto;
    touch-action:manipulation;
  }
  h1{font-size:22px;margin:0 0 2px;letter-spacing:.5px}
  .sub{color:var(--muted);font-size:13px;margin-bottom:14px}

  .seg{display:flex;background:#e9ebf1;border-radius:12px;padding:4px;margin-bottom:16px}
  .seg button{flex:1;border:0;background:transparent;color:#6b7280;font-size:14px;font-weight:600;
    padding:9px 0;border-radius:9px;font-family:inherit}
  .seg button.on{background:#fff;color:var(--accent);box-shadow:0 1px 4px rgba(0,0,0,.08)}

  .card{background:var(--card);border-radius:16px;padding:6px;margin-bottom:14px;
        box-shadow:0 1px 3px rgba(20,30,60,.06)}
  .card.flat{padding:14px}

  .warn{background:#fff6e5;border:1px solid #ffe0ad;color:#8a5a00;font-size:13px;
    padding:11px 13px;border-radius:12px;margin-bottom:14px;line-height:1.6}

  .navbar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .navbar .nav{width:40px;height:40px;flex:0 0 40px;border:0;border-radius:12px;background:#fff;
    color:var(--text);font-size:20px;line-height:1;box-shadow:0 1px 3px rgba(20,30,60,.06)}
  .navbar .nav:disabled{opacity:.35}
  .navbar .center{flex:1;text-align:center;font-weight:700;font-size:17px}
  .navbar .center small{display:block;font-weight:400;color:var(--muted);font-size:12px}
  .today-tag{display:inline-block;background:var(--accent);color:#fff;font-size:10px;
    padding:1px 6px;border-radius:20px;vertical-align:2px;margin-left:4px}

  .progress{padding:12px 14px 14px}
  .progress .top{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:8px}
  .progress .top b{color:var(--text)}
  .bar{height:7px;background:#eef0f5;border-radius:99px;overflow:hidden}
  .bar i{display:block;height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .25s}

  /* ——— 训练条目卡片 ——— */
  .ex{background:#fff;border-radius:15px;margin-bottom:10px;overflow:hidden;
      box-shadow:0 1px 3px rgba(20,30,60,.06);transition:background .15s}
  .ex-main{display:flex;align-items:center;gap:13px;padding:14px 14px 8px}
  .ex-main:active{background:var(--soft)}
  .ex .tick{width:27px;height:27px;flex:0 0 27px;border:2px solid #cfd5e2;border-radius:50%;
    display:flex;align-items:center;justify-content:center;
    transition:background .15s,border-color .15s,transform .12s}
  .ex .tick svg{width:16px;height:16px;opacity:0;transform:scale(.4);transition:all .15s}
  .ex .txt{flex:1;min-width:0}
  .ex .txt .n{font-weight:600;font-size:16.5px;word-break:break-all}
  .ex .txt .t{color:var(--muted);font-size:12.5px;margin-top:1px}
  .ex.done{background:#fbfcfe}
  .ex.done .tick{background:var(--accent);border-color:var(--accent)}
  .ex.done .tick svg{opacity:1;transform:scale(1)}
  .ex.done .txt .n{color:var(--done);text-decoration:line-through}
  .ex.done .txt .t{color:#d6dae4}
  .ex.pop .tick{transform:scale(1.18)}

  /* 拖拽：只用 transform 做动画，不触发重排 */
  .ex{transition:background .15s, transform .18s cubic-bezier(.2,.8,.3,1)}
  .ex.dragging{transition:none;position:relative;z-index:20;
    box-shadow:0 10px 26px rgba(20,30,60,.20);cursor:grabbing}
  .ex.settling{transition:transform .16s cubic-bezier(.2,.8,.3,1)}
  .exdel{width:30px;height:30px;flex:0 0 30px;border:0;background:transparent;color:#ccd2de;
    font-size:19px;line-height:1;border-radius:8px;padding:0}
  .exdel:active{background:#fff0f0;color:var(--danger)}
  .tmpbadge{display:inline-block;font-size:10px;font-weight:600;color:#8a6d00;background:#fff4d6;
    border-radius:6px;padding:1px 5px;margin-left:5px;vertical-align:2px;text-decoration:none}

  /* 重量 + 备注 工具行 */
  .ex-tools{display:flex;align-items:center;gap:8px;padding:0 14px 13px 54px;flex-wrap:wrap}
  .wfield{display:flex;align-items:center;background:var(--soft);border:1px solid var(--line);
    border-radius:10px;height:36px;padding:0 9px;gap:3px}
  .wfield input{width:52px;border:0;background:transparent;font-size:15px;font-family:inherit;
    font-weight:600;color:var(--text);padding:0;text-align:right;outline:none}
  .wfield input::placeholder{color:#c3c9d6;font-weight:400}
  .wfield .u{font-size:12px;color:var(--muted);font-weight:600}
  .last{font-size:12px;color:var(--accent);background:#eef3ff;padding:5px 9px;border-radius:8px;
    border:0;font-family:inherit;font-weight:600}
  .last:active{background:#e0e9ff}
  .notebtn{border:0;background:transparent;color:var(--muted);font-size:12.5px;font-family:inherit;
    padding:6px 2px;margin-left:auto;font-weight:500}
  .notebtn.has{color:var(--accent)}
  .notetext{font-size:13px;color:#5b6577;background:#f7f9fc;border-left:3px solid #dfe6f5;
    margin:0 14px 13px 54px;padding:8px 11px;border-radius:0 9px 9px 0;white-space:pre-wrap;
    word-break:break-word;line-height:1.65}

  .empty{text-align:center;color:var(--muted);font-size:14px;padding:26px 16px}
  .empty .big{font-size:15px;color:#6b7280;margin-bottom:4px}
  .empty .rest{font-size:34px;margin-bottom:6px}

  .addform{display:flex;gap:8px;padding:12px 14px;flex-wrap:wrap}
  .addform input{flex:1;min-width:0;height:44px;border:1px solid var(--line);border-radius:11px;
    padding:0 12px;font-size:15px;font-family:inherit;background:#fafbfd;color:var(--text)}
  .addform input.tgt{flex:0 0 104px}
  .addform input:focus{outline:none;border-color:var(--accent);background:#fff}
  .btn{border:0;border-radius:11px;background:var(--accent);color:#fff;font-weight:600;
    font-size:15px;font-family:inherit;padding:0 16px;height:44px}
  .btn:active{opacity:.85}
  .btn.ghost{background:#eef1f7;color:#4a5568;font-weight:500;font-size:13.5px;height:40px;padding:0 13px}
  .btn.wide{width:100%}

  .hint{font-size:12px;color:var(--muted);padding:0 16px 14px;line-height:1.65}

  .weekbar{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px}
  .weekbar button{flex:1 0 auto;min-width:44px;border:0;background:#fff;color:#4a5568;border-radius:11px;
    padding:9px 0;font-size:13px;font-weight:600;font-family:inherit;
    box-shadow:0 1px 3px rgba(20,30,60,.06);position:relative}
  .weekbar button.on{background:var(--accent);color:#fff}
  .weekbar button i{position:absolute;top:6px;right:7px;width:6px;height:6px;border-radius:50%;
    background:#2f6bff;display:none}
  .weekbar button.has i{display:block}
  .weekbar button.on i{background:#fff}

  .item{display:flex;align-items:center;gap:10px;padding:13px 14px}
  .item + .item{border-top:1px solid var(--line)}
  .item:active{background:var(--soft)}
  .item .txt{flex:1;min-width:0}
  .item .txt .n{font-weight:600;font-size:15.5px;word-break:break-all}
  .item .txt .t{color:var(--muted);font-size:12.5px;margin-top:1px}
  .item .txt .nt{color:#8d97a8;font-size:12px;margin-top:2px}
  .del{width:34px;height:34px;flex:0 0 34px;border:0;background:transparent;color:#c8cedb;
    font-size:20px;line-height:1;border-radius:10px}
  .del:active{background:#fff0f0;color:var(--danger)}

  .hist{padding:14px}
  .hist .hh{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px}
  .hist .hh b{font-size:15px}
  .hist .hh span{font-size:12.5px;color:var(--muted)}
  .chips{display:flex;flex-wrap:wrap;gap:6px}
  .chip{font-size:12px;padding:3px 9px;border-radius:20px;background:#eef1f7;color:#5b6577}
  .chip.on{background:#e6edff;color:var(--accent);text-decoration:line-through;opacity:.75}
  .chip.rest{background:#f2f0fb;color:#6b5fb8}
  .section-title{font-size:13px;color:var(--muted);margin:18px 4px 8px;font-weight:600}
  .statrow{display:flex;gap:8px;margin-bottom:14px}
  .stat{flex:1;background:#fff;border-radius:14px;padding:12px 10px;text-align:center;
    box-shadow:0 1px 3px rgba(20,30,60,.06)}
  .stat b{display:block;font-size:21px;line-height:1.2}
  .stat span{font-size:11.5px;color:var(--muted)}

  .setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;
    padding:13px 14px;font-size:14.5px}
  .setrow + .setrow{border-top:1px solid var(--line)}
  .setrow .lb{color:#4a5568}
  .setrow .lb small{display:block;color:var(--muted);font-size:11.5px;margin-top:1px}
  .lv{display:flex;background:#eef1f7;border-radius:10px;padding:3px}
  .lv button{border:0;background:transparent;color:#6b7280;font-size:13px;font-weight:600;
    font-family:inherit;padding:6px 12px;border-radius:8px}
  .lv button.on{background:#fff;color:var(--accent);box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .sw{width:50px;height:29px;border-radius:99px;background:#d8dde8;border:0;position:relative;
    transition:background .18s;flex:0 0 50px}
  .sw::after{content:'';position:absolute;top:2.5px;left:2.5px;width:24px;height:24px;border-radius:50%;
    background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .18s}
  .sw.on{background:var(--accent)}
  .sw.on::after{transform:translateX(21px)}

  .mask{position:fixed;inset:0;background:rgba(20,26,40,.42);opacity:0;pointer-events:none;
    transition:opacity .2s;z-index:50}
  .mask.on{opacity:1;pointer-events:auto}
  .sheet{position:fixed;left:0;right:0;bottom:0;background:#fff;border-radius:20px 20px 0 0;
    padding:16px 16px calc(env(safe-area-inset-bottom) + 16px);transform:translateY(120%);
    transition:transform .25s cubic-bezier(.3,.9,.4,1);z-index:51;
    max-width:560px;margin:0 auto;box-shadow:0 -4px 24px rgba(20,30,60,.14)}
  .sheet.on{transform:translateY(0)}
  .sheet .st{font-weight:700;font-size:16px;margin-bottom:3px;padding-right:30px}
  .sheet .ss{font-size:12px;color:var(--muted);margin-bottom:11px}
  .sheet textarea{width:100%;min-height:104px;border:1px solid var(--line);border-radius:12px;
    padding:11px 12px;font-size:15px;font-family:inherit;line-height:1.6;background:#fafbfd;
    color:var(--text);resize:vertical;outline:none}
  .sheet textarea:focus{border-color:var(--accent);background:#fff}
  .sheet .acts{display:flex;gap:9px;margin-top:12px}
  .sheet .acts .btn{flex:1}
  .nsinput{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;
    padding:0 13px;font-size:16px;font-family:inherit;background:#fafbfd;color:var(--text);outline:none}
  .nsinput:focus{border-color:var(--accent);background:#fff}

  /* ——— 方案卡片 ——— */
  .pchip{display:flex;align-items:center;gap:10px;padding:13px 14px}
  .pchip + .pchip{border-top:1px solid var(--line)}
  .pchip .txt{flex:1;min-width:0}
  .pchip .txt .n{font-weight:600;font-size:15.5px;word-break:break-all}
  .pchip .txt .t{color:var(--muted);font-size:12px;margin-top:2px;
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .pchip .apply{border:0;background:#eef3ff;color:var(--accent);font-weight:600;
    font-size:13.5px;font-family:inherit;padding:8px 14px;border-radius:10px;flex:0 0 auto}
  .pchip .apply:active{background:#e0e9ff}
  .pchip .del{margin-left:2px}

  /* ——— 重量趋势 ——— */
  .delta{font-size:12px;font-weight:700;padding:5px 8px;border-radius:8px;white-space:nowrap}
  .delta.up{color:#1f8a4c;background:#e8f7ee}
  .delta.down{color:#c0392b;background:#fdecea}
  .delta.flat{color:#6b7280;background:#f0f2f6}
  .pcard{background:#fff;border-radius:15px;padding:14px;margin-bottom:11px;
    box-shadow:0 1px 3px rgba(20,30,60,.06)}
  .pcard:active{background:#fafbfd}
  .phead{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
  .pname{font-weight:600;font-size:15.5px;word-break:break-all;min-width:0}
  .pnow{font-weight:700;font-size:19px;color:var(--accent);white-space:nowrap}
  .pnow small{font-size:11.5px;font-weight:600;color:var(--muted);margin-left:1px}
  .psub{display:flex;align-items:center;gap:8px;margin:7px 0 9px;flex-wrap:wrap}
  .pr{font-size:12px;color:#8b93a5}
  .pspark{display:block;width:100%;height:auto;margin-top:2px}
  .chart{display:block;width:100%;height:auto}
  .chartwrap{background:#fff;border-radius:15px;padding:8px 4px 4px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(20,30,60,.06)}
  .wlist{background:#fff;border-radius:15px;padding:4px 14px;margin-bottom:12px;
    box-shadow:0 1px 3px rgba(20,30,60,.06)}
  .wrow{display:flex;align-items:center;justify-content:space-between;gap:10px;
    padding:10px 0;font-size:14px}
  .wrow + .wrow{border-top:1px solid var(--line)}
  .wrow .wd{color:#6b7280;font-size:13px}
  .wrow .wv{font-weight:700}
  .cname{font-weight:700;font-size:17px;margin-bottom:2px;padding-right:30px}
  .cmeta{font-size:12.5px;color:var(--muted);margin-bottom:12px;line-height:1.6}
  .sheet.big{max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* ——— 每日感想 ——— */
  .diary{background:#fff;border-radius:15px;padding:14px;margin-bottom:12px;cursor:pointer;
    box-shadow:0 1px 3px rgba(20,30,60,.06);border-left:3px solid #e3e8f2;transition:background .15s}
  .diary:active{background:#fafbfd}
  .diary.has{border-left-color:var(--accent)}
  .diary .dtext{font-size:14.5px;color:#3c4658;line-height:1.75;white-space:pre-wrap;
    word-break:break-word}
  .diary .dedit{font-size:11.5px;color:var(--muted);margin-top:9px}
  .diary .dempty{font-size:13.5px;color:#a8b0bf;padding:3px 0}

  /* ——— 记录页里的日记 ——— */
  .dentry{font-size:13.5px;color:#4a5568;background:#f9fafc;border-radius:9px;
    padding:9px 11px;margin-top:9px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
  .dentry::before{content:'📝 ';}

  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);background:#1f2430;
    color:#fff;font-size:13.5px;padding:10px 18px;border-radius:99px;opacity:0;
    transition:all .22s;pointer-events:none;z-index:99;white-space:nowrap;max-width:92vw;overflow:hidden}
  .toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>

<h1>健身打卡</h1>
<div class="sub" id="subtitle"></div>

<div class="seg">
  <button data-view="checkin" class="on">打卡</button>
  <button data-view="plan">周计划</button>
  <button data-view="progress">进度</button>
  <button data-view="history">记录</button>
</div>

<div id="view"></div>

<div class="mask" id="mask"></div>
<div class="sheet" id="sheet">
  <div class="st" id="shTitle">备注</div>
  <div class="ss" id="shSub"></div>
  <textarea id="shText" placeholder="例如：注意膝盖不要内扣 / 最后一组力竭 / 下次加重 2.5kg"></textarea>
  <div class="acts">
    <button class="btn ghost" id="shClear">清空</button>
    <button class="btn ghost" id="shCancel">取消</button>
    <button class="btn" id="shSave">保存</button>
  </div>
</div>

<div class="sheet" id="nameSheet">
  <div class="st" id="nsTitle">存为方案</div>
  <div class="ss" id="nsSub"></div>
  <input class="nsinput" id="nsInput" type="text" autocomplete="off" placeholder="给这个方案起个名字">
  <div class="acts">
    <button class="btn ghost" id="nsCancel">取消</button>
    <button class="btn" id="nsOk">保存</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ================================================================
   ① 周计划默认内容（第一次打开时用它初始化）
      格式：  mon: [ { name:'动作名', target:'组数×次数', note:'备注(可省略)' } ]
      休息日写空数组 [] 就行。
   ================================================================ */
const DEFAULT_PLAN = {
  mon: [
    { name:'平板卧推',     target:'4×10', note:'' },
    { name:'上斜哑铃卧推', target:'3×12', note:'' },
    { name:'绳索下压',     target:'3×15', note:'' }
  ],
  tue: [
    { name:'引体向上', target:'4×8',  note:'' },
    { name:'杠铃划船', target:'4×10', note:'' },
    { name:'哑铃弯举', target:'3×12', note:'' }
  ],
  wed: [],
  thu: [
    { name:'深蹲',         target:'5×5',  note:'膝盖跟着脚尖方向' },
    { name:'罗马尼亚硬拉', target:'3×10', note:'' },
    { name:'腿举',         target:'3×12', note:'' }
  ],
  fri: [
    { name:'站姿推举', target:'4×10', note:'' },
    { name:'侧平举',   target:'4×15', note:'' },
    { name:'卷腹',     target:'3×20', note:'' }
  ],
  sat: [ { name:'慢跑', target:'30 分钟', note:'' } ],
  sun: []
};
/* ================================================================ */

const DAY_KEYS   = ['sun','mon','tue','wed','thu','fri','sat'];
const WEEK_ORDER = ['mon','tue','wed','thu','fri','sat','sun'];
const DAY_NAME   = { mon:'周一', tue:'周二', wed:'周三', thu:'周四', fri:'周五', sat:'周六', sun:'周日' };

const K_PLAN = 'gym.plan.v2', K_LOGS = 'gym.logs.v2', K_SET = 'gym.settings.v1';
const K_DIARY = 'gym.diary.v1';
const K_PRESETS = 'gym.presets.v1';

/* ---------- 存储 ---------- */
function load(key, fallback){
  try { const s = localStorage.getItem(key); return s ? JSON.parse(s) : fallback; }
  catch(e){ return fallback; }
}
function save(key, val){
  try { localStorage.setItem(key, JSON.stringify(val)); return true; }
  catch(e){ toast('保存失败，请导出备份'); return false; }
}

/* 老版本(v1)数据迁移 */
function migratePlan(p){
  const out = {};
  const keys = WEEK_ORDER.concat(['sun']);
  Object.keys(p).forEach(k => {
    out[k] = (p[k] || []).map(i => ({ name:i.name, target:i.target || '', note:i.note || '' }));
  });
  return Object.assign({ mon:[],tue:[],wed:[],thu:[],fri:[],sat:[],sun:[] }, out);
}
function migrateLogs(l){
  const out = {};
  Object.keys(l).forEach(dt => {
    const L = l[dt] || {};
    const items = (L.items || []).map(i => ({
      name:i.name, target:i.target || '', note:i.note || '',
      done:!!i.done, weight:i.weight || ''
    }));
    out[dt] = { dayKey:L.dayKey || dayKeyOfStr(dt), rest:(typeof L.rest === 'boolean' ? L.rest : items.length === 0), items:items };
  });
  return out;
}

let plan = load(K_PLAN, null);
if (!plan){
  const old = load('gym.plan.v1', null);
  plan = old ? migratePlan(old) : JSON.parse(JSON.stringify(DEFAULT_PLAN));
  save(K_PLAN, plan);
}
let logs = load(K_LOGS, null);
if (!logs){
  const old = load('gym.logs.v1', null);
  logs = old ? migrateLogs(old) : {};
  save(K_LOGS, logs);
}
let settings = Object.assign({ vib:true, level:1 }, load(K_SET, {}));

let diary = load(K_DIARY, {});

(function cleanDiary(){

  });

})();
function getDiary(d){ return diary[d] || ''; }
function setDiary(d, txt){

/* ---------- 方案（可复用的动作组合） ----------
   把某一天排好的动作存成「方案一」，之后任意一天一键照搬。 */
let presets = load(K_PRESETS, []);
(function cleanPresets(){
  if (!Array.isArray(presets)){ presets = []; return; }
  const before = JSON.stringify(presets);
  presets = presets
    .filter(p => p && typeof p.name === 'string' && Array.isArray(p.items))
    .map(p => ({

        .map(i => ({ name:String((i && i.name) || ''), target:String((i && i.target) || ''), note:String((i && i.note) || '') }))
        .filter(i => i.name)
    }));
  if (JSON.stringify(presets) !== before) save(K_PRESETS, presets);
})();
function presetById(id){ return presets.find(p => String(p.id) === String(id)); }
/* 起名时避免重名 */
function uniquePresetName(base){
  const taken = {};

  let n = base, i = 2;
  while (taken[n]) { n = base + ' ' + i; i++; }

/* 存储自检：file:// 下少数安卓浏览器会禁用 localStorage，
   那样数据存不住。宁可开机就报警，也不要练完发现没记上。 */
const STORAGE_OK = (function(){
  try {
    const k = 'gym.__probe';
    localStorage.setItem(k, '1');
    const v = localStorage.getItem(k);
    localStorage.removeItem(k);
    return v === '1';
  } catch(e){ return false; }
})();

const LEVELS = [ {k:0.65, label:'弱'}, {k:1, label:'标准'}, {k:1.9, label:'强'} ];

/* ---------- 小工具 ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ymd = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
const todayStr = () => ymd(new Date());
function parseYmd(s){ const p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function dayKeyOf(d){ return DAY_KEYS[d.getDay()]; }
function dayKeyOfStr(s){ return dayKeyOf(parseYmd(s)); }
function prettyDate(s){
  const d = parseYmd(s);
  return (d.getMonth()+1) + '月' + d.getDate() + '日 周' + '日一二三四五六'[d.getDay()];
}
function daysAgoLabel(s){
  const a = parseYmd(todayStr()), b = parseYmd(s);
  const n = Math.round((a - b) / 86400000);
  if (n === 0) return '今天'; if (n === 1) return '昨天';
  if (n === 2) return '前天'; return n + '天前';
}

/* ---------- 震动 ----------
   navigator.vibrate 在 Android 的 Chrome / Edge 上都可用；
   iOS Safari 和微信内置浏览器不支持（苹果明确反对该标准）。
   手机开静音或勿扰时不会震，这是系统行为，代码无法绕过。
   参数单位是毫秒。                                               */
const VIB_BASE = { check:[34], uncheck:[12], nav:[8], day:[8], add:[22], save:[18] };
function canVibrate(){ return typeof navigator.vibrate === 'function'; }

function bump(kind){
  if (!settings.vib || !canVibrate()) return;
  const base = VIB_BASE[kind] || [15];
  try { navigator.vibrate(base.map(v => Math.max(1, Math.round(v * settings.level)))); } catch(e){}
}
function bumpPattern(pat){
  if (!canVibrate()) return false;
  try { navigator.vibrate(pat.map(v => Math.max(1, Math.round(v * settings.level)))); return true; }
  catch(e){ return false; }
}

let toastTimer;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('on'), 1900);
}

/* ---------- 打卡记录（快照） ---------- */
function makeItems(dayKey){
  return (plan[dayKey] || []).map(i => ({
    name:i.name, target:i.target || '', note:i.note || '', done:false, weight:''
  }));
}
function createLog(dateStr){
  if (logs[dateStr]) return logs[dateStr];
  if (dateStr > todayStr()) return null;
  const dk = dayKeyOfStr(dateStr);
  const items = makeItems(dk);
  logs[dateStr] = { dayKey:dk, rest: items.length === 0, items:items };
  save(K_LOGS, logs);
  return logs[dateStr];
}
function regenLog(dateStr){
  const dk = dayKeyOfStr(dateStr);
  const items = makeItems(dk);
  logs[dateStr] = { dayKey:dk, rest: items.length === 0, items:items };
  save(K_LOGS, logs);
}

/* 上一次这个动作记录的重量（严格早于 beforeDate，跳过空的） */
function lastWeightFor(name, beforeDate){
  const dates = Object.keys(logs).filter(d => d < beforeDate).sort().reverse();
  for (const dt of dates){
    const it = ((logs[dt] && logs[dt].items) || []).find(i => i.name === name && i.weight);
    if (it) return { weight:it.weight, date:dt };
  }
  return null;
}

/* 某个动作的完整重量历史（按日期升序） */
function weightHistoryFor(name){
  return Object.keys(logs).sort().filter(dt => {
    const it = ((logs[dt] && logs[dt].items) || []).find(i => i.name === name && i.weight);
    return !!it;
  }).map(dt => ({
    date: dt,
    weight: parseFloat(((logs[dt].items.find(i => i.name === name && i.weight) || {}).weight) || '0'),
    raw: (logs[dt].items.find(i => i.name === name && i.weight) || {}).weight
  })).filter(p => isFinite(p.weight) && p.weight > 0);
}

/* 迷你趋势线：把一组数值画成小 SVG */
function sparkline(vals, w, h){
  w = w || 74; h = h || 26;
  if (vals.length < 2){ return '<svg class="pspark" width="' + w + '" height="' + h + '"></svg>'; }
  const mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  const span = (mx - mn) || 1;
  const pad = 4;
  const px = i => pad + i * (w - pad*2) / (vals.length - 1);
  const py = v => h - pad - (v - mn) * (h - pad*2) / span;
  let d = '';
  vals.forEach((v, i) => { d += (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(v).toFixed(1); });
  const up = vals[vals.length-1] >= vals[0];
  const col = up ? '#1f8a4c' : '#c0392b';
  return '<svg class="pspark" width="' + w + '" height="' + h + '" viewBox="0 0 ' + w + ' ' + h + '">'
    + '<path d="' + d + '" fill="none" stroke="' + col + '" stroke-width="2" '
    + 'stroke-linecap="round" stroke-linejoin="round"/>'
    + '<circle cx="' + px(vals.length-1).toFixed(1) + '" cy="' + py(vals[vals.length-1]).toFixed(1)
    + '" r="3" fill="' + col + '"/></svg>';
}

/* 大图：某动作的重量折线，带坐标轴和数值标注 */
function weightChart(points){
  const W = 320, H = 170, L = 34, R = 10, T = 14, B = 26;
  const n = points.length;
  const vals = points.map(p => p.weight);
  let mn = Math.min.apply(null, vals), mx = Math.max.apply(null, vals);
  if (mn === mx){ mn -= 2.5; mx += 2.5; }
  else { const pad = (mx - mn) * 0.18; mn -= pad; mx += pad; }
  const iw = W - L - R, ih = H - T - B;
  const px = i => L + (n === 1 ? iw/2 : i * iw / (n - 1));
  const py = v => T + ih - (v - mn) * ih / (mx - mn);

  let g = '';
  /* 横向网格 + y 轴刻度 */
  for (let k = 0; k <= 3; k++){
    const v = mn + (mx - mn) * k / 3;
    const y = py(v);
    g += '<line x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W-R) + '" y2="' + y.toFixed(1)
       + '" stroke="#eef0f5" stroke-width="1"/>'
       + '<text x="' + (L-5) + '" y="' + (y+3.5).toFixed(1) + '" font-size="9" fill="#aab2c0" '
       + 'text-anchor="end">' + (Math.round(v*10)/10) + '</text>';
  }
  /* 折线 + 数据点 */
  let d = '';
  points.forEach((p, i) => { d += (i ? 'L' : 'M') + px(i).toFixed(1) + ' ' + py(p.weight).toFixed(1); });
  let dots = '';
  points.forEach((p, i) => {
    const isLast = i === n - 1;
    dots += '<circle cx="' + px(i).toFixed(1) + '" cy="' + py(p.weight).toFixed(1) + '" r="'
         +  (isLast ? 4 : 2.6) + '" fill="' + (isLast ? '#2f6bff' : '#fff')
         + '" stroke="#2f6bff" stroke-width="2"/>';
  });
  /* 只标首尾，避免字挤在一起 */
  let labels = '';
  [0, n-1].forEach((i, k) => {
    if (n === 1 && k === 1) return;
    const p = points[i];
    const anchor = (n === 1) ? 'middle' : (i === 0 ? 'start' : 'end');
    const x = n === 1 ? px(0) : (i === 0 ? L : W-R);
    labels += '<text x="' + x + '" y="' + (H-8) + '" font-size="9" fill="#aab2c0" text-anchor="'
           +  anchor + '">' + shortDate(p.date) + '</text>';
  });
  /* 最高/最低点数值 */
  const mxIdx = vals.indexOf(Math.max.apply(null, vals));
  const mnIdx = vals.indexOf(Math.min.apply(null, vals));
  let marks = '';
  [[mxIdx,'#1f8a4c'],[mnIdx,'#c0392b']].forEach(pair => {
    const i = pair[0], col = pair[1];
    if (n < 3) return;
    marks += '<text x="' + px(i).toFixed(1) + '" y="' + (py(vals[i]) - 7).toFixed(1)
          + '" font-size="9.5" font-weight="700" fill="' + col + '" text-anchor="middle">'
          +  vals[i] + '</text>';
  });

  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">'
    + g
    + '<path d="' + d + '" fill="none" stroke="#2f6bff" stroke-width="2.4" '
    + 'stroke-linecap="round" stroke-linejoin="round"/>'
    + dots + labels + marks
    + '</svg>';
}
function shortDate(s){ const p = s.split('-'); return (+p[1]) + '/' + (+p[2]); }

/* 跟上次比是重了还是轻了 */
function deltaBadge(now, last){
  if (!last) return '';
  const cur = parseFloat(now), prev = parseFloat(last.weight);
  if (!isFinite(cur) || !isFinite(prev)) return '';
  const diff = Math.round((cur - prev) * 10) / 10;
  if (diff > 0) return '<span class="delta up">▲ +' + diff + '</span>';
  if (diff < 0) return '<span class="delta down">▼ ' + diff + '</span>';
  return '<span class="delta flat">— 持平</span>';
}

  return h;

/* ---------- 进度页（重量趋势） ---------- */
let progressEx = null;          // 当前展开详情的动作名

function collectExerciseStats(){
  const names = {};
  Object.keys(logs).forEach(dt => {
    ((logs[dt] && logs[dt].items) || []).forEach(i => {
      if (i.name && i.weight && isFinite(parseFloat(i.weight)) && parseFloat(i.weight) > 0){
        (names[i.name] = names[i.name] || []).push(dt);
      }
    });
  });
  return Object.keys(names).map(name => {
    const hist = weightHistoryFor(name);
    return { name:name, hist:hist, lastDate:hist[hist.length-1].date, n:hist.length };
  }).sort((a, b) => b.lastDate.localeCompare(a.lastDate));
}

function htmlProgress(){
  const stats = collectExerciseStats();
  let h = '';

  if (progressEx){
    const hist = weightHistoryFor(progressEx);
    const first = hist[0], last = hist[hist.length-1];
    const total = Math.round((last.weight - first.weight) * 10) / 10;
    h += '<div class="navbar"><button class="nav" data-pback="1">‹</button>'
      +  '<div class="center">' + esc(progressEx) + '<small>共 ' + hist.length + ' 次记录</small></div>'
      +  '<div style="width:40px"></div></div>';

      +  '<div class="stat"><b>' + last.weight + '</b><span>最近一次 kg</span></div>'
      +  '<div class="stat"><b style="color:' + (total > 0 ? '#1f8a4c' : total < 0 ? '#c0392b' : '#1f2430')
      +  '">' + (total > 0 ? '+' : '') + total + '</b><span>总变化 kg</span></div>'
      +  '<div class="stat"><b>' + Math.max.apply(null, hist.map(p=>p.weight))
      +  '</b><span>最高 kg</span></div>'

    h += '<div class="section-title">每次记录</div><div class="wlist">';
    hist.slice().reverse().forEach((p, idx, arr) => {

      h += '<div class="wrow"><span class="wd">' + prettyDate(p.date) + '</span>'
        +  '<span style="display:flex;align-items:center;gap:8px">'
        +  (diff !== null && diff !== 0

              + (diff > 0 ? '+' : '') + diff + '</span>' : '')
        +  '<span class="wv">' + p.raw + ' kg</span></span></div>';
    });
    h += '</div>';
    return h;
  }

  if (!stats.length){
    h = '<div class="card"><div class="empty"><div class="rest">📈</div>'
      + '<div class="big">还没有重量数据</div>'
      + '在打卡页给动作填上 kg，这里就会出现趋势图</div></div>';
    return h;
  }

  h += '<div class="hint" style="padding:0 4px 12px">点任意动作看它的完整曲线</div>';
  stats.forEach(s => {
    const hist = s.hist;
    const last = hist[hist.length-1], prev = hist[hist.length-2];
    const vals = hist.map(p => p.weight);
    h += '<div class="pcard" data-popen="' + esc(s.name) + '">'
      +  '<div class="phead"><span class="pname">' + esc(s.name) + '</span>'
      +  '<span class="pnow">' + last.weight + '<small>kg</small></span></div>'
      +  '<div class="psub"><span class="pr">' + (hist.length > 1
          ? hist.length + ' 次 · 最近 ' + shortDate(last.date)
          : '首次记录 ' + shortDate(last.date)) + '</span>'
      +  (prev ? deltaBadge(String(last.weight), { weight:String(prev.weight) }) : '')
      +  '</div>'
      +  (hist.length > 1 ? sparkline(vals) : '')
      +  '</div>';
  });
  return h;
}

  let trainDays = 0, restDays = 0, doneAll = 0, allAll = 0;
  logDates.forEach(dt => {
    const L = logs[dt], its = (L && L.items) || [];
    if (L.rest || !its.length) restDays++; else trainDays++;
    its.forEach(i => { allAll++; if (i.done) doneAll++; });

      const pct = Math.round(doneAll / allAll * 100);
      h += '<div class="card"><div class="progress"><div class="top">'

    dates.slice(0, 60).forEach(dt => {

      const items = (L && L.items) || [];

      } else {

    +  '<div class="setrow"><div class="lb">本地存储'

  return h;

/* ---------- 按住拖动排序 ----------
   手指按住卡片约 0.2 秒进入拖拽，之后上下拖动。
   关键：整个过程只改 transform（交给 GPU 合成），不插入 DOM、不量元素，
   所以不会触发浏览器重排——这是不卡的根本原因。
   换位只改变"其它卡片让位"的 translateY，带 CSS 过渡所以是平滑动画。 */

let dragSuppressClick = false;
let pressState = null;

function shiftOthers(s){
  const step = s.h + s.gap;
  s.rects.forEach((r, i) => {
    if (i === s.from) return;
    let d = 0;
    if (s.from < s.to && i > s.from && i <= s.to) d = -step;
    else if (s.from > s.to && i >= s.to && i < s.from) d = step;
    r.el.style.transform = d ? 'translateY(' + d + 'px)' : '';
  });
}

function dragFrame(s){
  if (!pressState || pressState !== s || !s.active) return;
  const dy = s.lastY - s.startY;
  s.el.style.transform = 'translateY(' + dy + 'px) scale(1.02)';

  /* 用被拖卡片的中心线判断该落在第几格 */
  const center = s.rects[s.from].top + dy + s.h / 2;
  let to = s.from;
  for (let i = s.from - 1; i >= 0; i--){
    if (center < s.rects[i].top + s.rects[i].h / 2) to = i; else break;
  }
  for (let i = s.from + 1; i < s.rects.length; i++){
    if (center > s.rects[i].top + s.rects[i].h / 2) to = i; else break;
  }
  if (to !== s.to){ s.to = to; shiftOthers(s); }
}

function lockScroll(on){
  document.documentElement.style.overflow = on ? 'hidden' : '';
  document.body.style.overflow = on ? 'hidden' : '';
}

function bindPressDrag(itemSel, commit){
  const collect = () => Array.prototype.slice.call(document.querySelectorAll(itemSel));
  const items = collect();

  /* 拖拽期间禁用页面滚动（手机上唯一可靠的做法，必须是非 passive） */
  if (!bindPressDrag._touchBound){
    bindPressDrag._touchBound = true;
    document.addEventListener('touchmove', e => {
      if (pressState && pressState.active) e.preventDefault();
    }, { passive: false });
  }

  items.forEach(el => {
    el.addEventListener('pointerdown', ev => {
      if (ev.button != null && ev.button !== 0) return;
      if (pressState) return;
      /* 按钮、输入框、备注文字上按下时不进入拖拽 */
      if (ev.target && ev.target.closest && ev.target.closest('button, input, label, .notetext')) return;

      const s = {
        el: el, pid: ev.pointerId, startY: ev.clientY, startX: ev.clientX,
        lastY: ev.clientY, active: false, from: 0, to: 0,
        h: 0, gap: 10, rects: [], timer: 0, raf: 0
      };
      pressState = s;

      s.timer = setTimeout(() => {
        if (pressState !== s) return;
        const arr = collect();
        const from = arr.indexOf(el);
        if (from < 0){ pressState = null; return; }

        /* 只在进入拖拽的这一瞬间量一次位置，之后全程复用 */
        s.rects = arr.map(x => {
          const r = x.getBoundingClientRect();
          return { top: r.top, h: r.height, el: x };
        });
        s.from = from;
        s.to = from;
        s.h = s.rects[from].h;
        s.gap = s.rects.length > 1
          ? Math.max(0, s.rects[1].top - (s.rects[0].top + s.rects[0].h))
          : 10;
        s.active = true;
        el.classList.add('dragging');
        lockScroll(true);
        try { el.setPointerCapture(s.pid); } catch(e){}
        bump('add');
      }, 200);
    });

    el.addEventListener('pointermove', ev => {
      const s = pressState;
      if (!s || s.el !== el) return;

      if (!s.active){
        /* 还没进入拖拽：手指明显移动了就当成滑动页面，取消长按 */
        if (Math.abs(ev.clientY - s.startY) > 10 || Math.abs(ev.clientX - s.startX) > 10){
          clearTimeout(s.timer);
          pressState = null;
        }
        return;
      }
      s.lastY = ev.clientY;
      if (!s.raf){
        s.raf = requestAnimationFrame(() => { s.raf = 0; dragFrame(s); });
      }
    });

    el.addEventListener('pointerup', () => {
      const s = pressState;
      if (!s || s.el !== el) return;
      clearTimeout(s.timer);
      if (!s.active){ pressState = null; return; }

      const from = s.from, to = s.to, n = s.rects.length;
      el.classList.remove('dragging');
      el.style.transform = '';
      s.rects.forEach(r => { r.el.style.transform = ''; });
      lockScroll(false);
      pressState = null;

      /* 拖过一次就别再触发"打勾" */
      dragSuppressClick = true;
      setTimeout(() => { dragSuppressClick = false; }, 400);

      if (from === to) return;
      bump('check');

      const order = [];
      for (let i = 0; i < n; i++) order.push(i);
      const moved = order.splice(from, 1)[0];
      order.splice(to, 0, moved);
      commit(order);
    });

    el.addEventListener('pointercancel', () => {
      const s = pressState;
      if (!s || s.el !== el) return;
      clearTimeout(s.timer);
      if (s.active){
        el.classList.remove('dragging');
        el.style.transform = '';
        s.rects.forEach(r => { r.el.style.transform = ''; });
        lockScroll(false);
      }
      pressState = null;
    });
  });
}

/* 按新顺序重排某一天的打卡条目 */
function reorderLogItems(dateStr, order){
  const log = logs[dateStr];
  if (!log || !Array.isArray(log.items)) return;
  const old = log.items.slice();
  if (!Array.isArray(order) || order.length !== old.length) return;

  /* 必须正好是 0..n-1 的一个排列。
     只查长度不够——[0,0,0] 长度也对，但会把同一个动作复制三份。 */
  const seen = {};
  for (const i of order){
    if (!Number.isInteger(i) || i < 0 || i >= old.length || seen[i]) return;
    seen[i] = 1;
  }

  log.items = order.map(i => old[i]);
  save(K_LOGS, logs);
  bump('save');
  render();
}

function bind(){
  document.querySelectorAll('.seg button').forEach(b => {
    b.onclick = () => { view = b.dataset.view; render(); };
  });

  document.querySelectorAll('[data-mv]').forEach(b => {
    b.onclick = () => {
      const d = parseYmd(checkinDate);
      d.setDate(d.getDate() + Number(b.dataset.mv));
      const s = ymd(d);
      if (s > todayStr()) return;
      checkinDate = s; bump('nav'); render();
    };
  });

  /* 打勾 */
  document.querySelectorAll('[data-toggle]').forEach(el => {
    el.onclick = () => {
      if (dragSuppressClick) return;          /* 刚拖过，别顺带打勾 */
      const log = logs[checkinDate]; if (!log) return;
      const it = log.items[Number(el.dataset.toggle)];
      if (!it) return;
      it.done = !it.done;
      save(K_LOGS, logs);
      if (it.done){
        bump('check');
        const card = el.closest('.ex');
        if (card) card.classList.add('done','pop');
        setTimeout(render, 180);
      } else { bump('uncheck'); render(); }
    };
  });

  /* 重量输入 */
  document.querySelectorAll('[data-w]').forEach(inp => {
    inp.onclick = e => e.stopPropagation();
    inp.oninput = () => {
      const log = logs[checkinDate]; if (!log) return;
      log.items[Number(inp.dataset.w)].weight = inp.value.trim();
      save(K_LOGS, logs);
    };
  });

  /* 点「上次 60」直接填入 */
  document.querySelectorAll('[data-fill]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const i = Number(b.dataset.fill), log = logs[checkinDate]; if (!log) return;
      const last = lastWeightFor(log.items[i].name, checkinDate);
      if (!last) return;
      log.items[i].weight = last.weight;
      save(K_LOGS, logs); bump('save'); render();
      toast('已填入上次的 ' + last.weight + 'kg');
    };
  });

  /* 打卡页备注 */
  document.querySelectorAll('[data-note]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const i = Number(el.dataset.note), log = logs[checkinDate]; if (!log) return;
      const it = log.items[i];
      openSheet(it.name, '只影响 ' + prettyDate(checkinDate) + ' 这一天',
        it.note, '例如：今天状态差，减了 5kg / 肩膀有点紧',
        v => { it.note = v; save(K_LOGS, logs); render(); toast(v ? '备注已保存' : '备注已清空'); });
    };
  });

  /* 补记这一天 */
  const cr = document.querySelector('[data-create]');
  if (cr) cr.onclick = () => { createLog(checkinDate); bump('save'); toast('已生成记录'); render(); };

  /* 临时动作：只加到这一天 */
  const tmpBtn = document.querySelector('[data-tmpadd]');
  if (tmpBtn) tmpBtn.onclick = () => {
    const n  = $('#tmpName').value.trim();
    const tg = $('#tmpTgt').value.trim();
    if (!n){ toast('先写个动作名'); try{ $('#tmpName').focus(); }catch(e){} return; }
    if (!logs[checkinDate]) createLog(checkinDate);
    const log = logs[checkinDate];
    if (!log){ toast('这一天还不能添加'); return; }
    log.items = log.items || [];
    log.items.push({ name:n, target:tg || '', note:'', done:false, weight:'', temp:true });
    log.rest = false;
    save(K_LOGS, logs);
    bump('add');
    toast('已加上：' + n + '（只影响这一天）');
    render();
  };

  /* 从这一天移除某个动作 */
  document.querySelectorAll('[data-exdel]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const log = logs[checkinDate]; if (!log || !log.items) return;
      const i = Number(b.dataset.exdel);
      const it = log.items[i]; if (!it) return;
      if (!confirm('从' + prettyDate(checkinDate) + '移除「' + it.name + '」？\n\n'
          + '只影响这一天，周计划不会被改动。')) return;
      log.items.splice(i, 1);
      if (!log.items.length) log.rest = true;   /* 全删光就当作休息日 */
      save(K_LOGS, logs);
      bump('uncheck');
      toast('已移除');
      render();
    };
  });

  /* 打卡页：拖动排序 */
  bindPressDrag('[data-ex]', order => reorderLogItems(checkinDate, order));

  /* 重新生成 */
  const rg = document.querySelector('[data-regen]');
  if (rg) rg.onclick = () => {
    if (!confirm('用当前周计划重做这天的清单？已打勾的状态和填的重量都会清空。')) return;
    regenLog(checkinDate); toast('已重新生成'); render();
  };

  /* 每日感想 */
  document.querySelectorAll('[data-diary]').forEach(el => {
    el.onclick = () => {
      const d = el.dataset.diary;
      const wasEmpty = !hasDiary(d);
      openSheet('每日感想', prettyDate(d) + ' · 写点训练感受、状态、想法都行',
        getDiary(d), '例如：今天状态不错，卧推第一次上 60kg，最后一组有点勉强，明天注意肩部放松',
        v => {
          setDiary(d, v);
          render();
          if (v && wasEmpty) toast('已保存今天的感想');
          else if (v) toast('已更新');
          else toast('已清空');
        }, { big:true });
    };
  });

  /* 进度页：展开某动作详情 */
  document.querySelectorAll('[data-popen]').forEach(el => {
    el.onclick = () => { progressEx = el.dataset.popen; bump('nav'); render(); };
  });
  const pb = document.querySelector('[data-pback]');
  if (pb) pb.onclick = () => { progressEx = null; bump('nav'); render(); };

  /* 周计划：切换星期 */
  document.querySelectorAll('[data-day]').forEach(b => {
    b.onclick = () => { planDay = b.dataset.day; bump('day'); render(); };
  });

  /* 周计划：添加 */
  const addBtn = document.querySelector('[data-add]');
  if (addBtn) addBtn.onclick = () => {
    const n = $('#inName').value.trim(), t = $('#inTgt').value.trim();
    if (!n) { toast('先写个动作名'); $('#inName').focus(); return; }
    (plan[planDay] = plan[planDay] || []).push({ name:n, target:t || '', note:'' });
    save(K_PLAN, plan); bump('add'); toast('已添加：' + n); render();
  };

  /* 周计划：备注 */
  document.querySelectorAll('[data-pnote]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const it = plan[planDay][Number(el.dataset.pnote)];
      openSheet(it.name, '周计划备注，以后每次练这个动作都会带出来',
        it.note, '例如：膝盖跟着脚尖方向 / 握距略宽于肩',
        v => { it.note = v; save(K_PLAN, plan); render(); toast(v ? '备注已保存' : '备注已清空'); });
    };
  });

  /* 周计划：删除 */
  document.querySelectorAll('[data-del]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const i = Number(b.dataset.del);
      if (!confirm('删除「' + plan[planDay][i].name + '」？')) return;
      plan[planDay].splice(i, 1); save(K_PLAN, plan); bump('uncheck'); render();
    };
  });

  /* 周计划：改名 / 改组数 */
  document.querySelectorAll('[data-edit]').forEach(el => {
    el.onclick = e => {
      if (e.target.closest('[data-del]') || e.target.closest('[data-pnote]')) return;
      const it = plan[planDay][Number(el.dataset.edit)];
      const n = prompt('动作名：', it.name); if (n === null) return;
      const t = prompt('组数/次数（可以留空）：', it.target); if (t === null) return;
      it.name = n.trim() || it.name; it.target = t.trim();
      save(K_PLAN, plan); render();
    };
  });

  /* ——— 方案：保存当前这天 ——— */
  const psave = document.querySelector('[data-psave]');
  if (psave) psave.onclick = () => {
    const list = plan[planDay] || [];
    if (!list.length){ toast(DAY_NAME[planDay] + '还没有动作，先加几个'); return; }
    const base = uniquePresetName(DAY_NAME[planDay] + '训练');
    openNameSheet('存为方案',
      '把' + DAY_NAME[planDay] + '这 ' + list.length + ' 个动作存下来，以后任意一天都能套用',
      base,
      v => {
        const name = String(v || '').trim();
        if (!name){ toast('给方案起个名字'); return; }
        presets.push({
          id: String(Date.now()) + Math.floor(Math.random() * 1000),
          name: name,
          items: list.map(i => ({ name:i.name, target:i.target || '', note:i.note || '' }))
        });
        save(K_PRESETS, presets);
        bump('save');
        toast('已存为「' + name + '」');
        render();
      });
  };

  /* ——— 方案：套用到当前这天 ——— */
  document.querySelectorAll('[data-papply]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const p = presetById(b.dataset.papply);
      if (!p) return;
      const list = plan[planDay] || [];
      const msg = list.length
        ? '用「' + p.name + '」替换' + DAY_NAME[planDay] + '现在的 ' + list.length + ' 个动作？\n（原来的动作会被替换掉）'
        : '把「' + p.name + '」的 ' + p.items.length + ' 个动作套用到' + DAY_NAME[planDay] + '？';
      if (!confirm(msg)) return;

      plan[planDay] = p.items.map(i => ({ name:i.name, target:i.target || '', note:i.note || '' }));
      save(K_PLAN, plan);
      bump('save');
      toast('已套用「' + p.name + '」');

      /* 如果改的正是今天、而且今天已经生成了打卡清单，提醒同步 */
      if (dayKeyOf(new Date()) === planDay && logs[todayStr()]){
        render();
        if (confirm('今天的打卡清单已经生成了。\n要按新的动作更新今天吗？\n\n（今天已勾选的状态和填的重量会清空）')){
          regenLog(todayStr());
          toast('今天的清单已更新');
        }
      }
      render();
    };
  });

  /* ——— 方案：重命名（点名字） ——— */
  document.querySelectorAll('[data-prename]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const p = presetById(el.dataset.prename);
      if (!p) return;
      openNameSheet('重命名方案', '给这个方案换个名字', p.name, v => {
        const name = String(v || '').trim();
        if (!name){ toast('名字不能为空'); return; }
        p.name = name;
        save(K_PRESETS, presets);
        toast('已重命名');
        render();
      });
    };
  });

  /* ——— 方案：删除 ——— */
  document.querySelectorAll('[data-pdel]').forEach(b => {
    b.onclick = e => {
      e.stopPropagation();
      const p = presetById(b.dataset.pdel);
      if (!p) return;
      if (!confirm('删除方案「' + p.name + '」？\n（已经套用到各天的动作不会被删掉）')) return;
      presets = presets.filter(x => String(x.id) !== String(p.id));
      save(K_PRESETS, presets);
      bump('uncheck');
      toast('已删除');
      render();
    };
  });

  /* 震动开关 */
  const sw = document.querySelector('[data-vibsw]');
  if (sw) sw.onclick = () => {
    settings.vib = !settings.vib; save(K_SET, settings);
    if (settings.vib) bump('check');
    render();
    if (settings.vib && !canVibrate()) toast('这个浏览器不支持震动');
  };

  /* 震动强度 */
  document.querySelectorAll('[data-lvl]').forEach(b => {
    b.onclick = () => {
      settings.level = LEVELS[Number(b.dataset.lvl)].k;
      save(K_SET, settings); bump('check'); render();
    };
  });

  /* 试震 */
  document.querySelectorAll('[data-test]').forEach(b => {
    b.onclick = () => {
      const ok = bumpPattern(b.dataset.test === '3' ? [60,70,60,70,120] : [45]);
      if (!ok) toast('这个浏览器不支持震动，换 Chrome 打开');
      else toast(b.dataset.test === '3' ? '这是一串连震' : '这是单次震动');
    };
  });

  /* 记录页：点日记可以就地修改 */
  document.querySelectorAll('[data-diaryhist]').forEach(el => {
    el.onclick = () => {
      const d = el.dataset.diaryhist;
      openSheet('每日感想', prettyDate(d), getDiary(d),
        '写点训练感受、状态、想法…',
        v => { setDiary(d, v); render(); toast(v ? '已保存' : '已清空'); }, { big:true });
    };
  });

  /* 导出 */
  const ex = document.querySelector('[data-export]');
  if (ex) ex.onclick = () => {
    const data = { app:'gym-checkin', v:4, exportedAt:new Date().toISOString(),
                   plan, logs, settings, diary, presets };
    const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = '健身打卡备份-' + todayStr() + '.json';
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    toast('已导出到「下载」文件夹');
  };

  /* 导入 */
  const im = document.querySelector('[data-import]');
  if (im) im.onclick = () => $('#fileIn').click();
  const fi = $('#fileIn');
  if (fi) fi.onchange = () => {
    const f = fi.files[0]; if (!f) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const d = JSON.parse(r.result);
        if (!d.plan || !d.logs) throw 0;
        if (!confirm('导入会覆盖当前计划、记录、感想和方案，继续？')) return;
        plan = migratePlan(d.plan); logs = migrateLogs(d.logs);
        /* 老备份里没有 diary / presets 字段，这时保留当前的，不清空 */
        if (d.diary && typeof d.diary === 'object') diary = d.diary;
        if (Array.isArray(d.presets)){
          presets = d.presets
            .filter(p => p && typeof p.name === 'string' && Array.isArray(p.items))
            .map(p => ({
              id: String(p.id || (Date.now() + Math.random())),
              name: p.name,
              items: p.items.map(i => ({ name:String((i && i.name) || ''),
                                         target:String((i && i.target) || ''),
                                         note:String((i && i.note) || '') })).filter(i => i.name)
            }));
        }
        if (d.settings) { settings = Object.assign(settings, d.settings); save(K_SET, settings); }
        save(K_PLAN, plan); save(K_LOGS, logs); save(K_DIARY, diary); save(K_PRESETS, presets);
        toast('导入成功'); render();
      } catch(e){ toast('这个文件读不出来'); }
      fi.value = '';
    };
    r.readAsText(f);
  };

  /* 补记漏掉的休息日 */
  const bf = document.querySelector('[data-backfill]');
  if (bf) bf.onclick = () => {
    const dates = Object.keys(logs).sort();
    if (!dates.length) { toast('还没有任何记录'); return; }
    const d = parseYmd(dates[0]), end = parseYmd(todayStr());
    const miss = [];
    while (d <= end){
      const s = ymd(d);
      if (!logs[s] && (plan[dayKeyOf(d)] || []).length === 0) miss.push(s);
      d.setDate(d.getDate() + 1);
    }
    if (!miss.length) { toast('没有需要补的日子'); return; }
    if (!confirm('把 ' + miss.length + ' 个没有记录的日期标成休息日？\n从 ' + miss[0] + ' 开始\n\n'
        + '如果你在那几天其实练过，就点「取消」。')) return;
    miss.forEach(s => { logs[s] = { dayKey:dayKeyOfStr(s), rest:true, items:[] }; });
    save(K_LOGS, logs); toast('已补 ' + miss.length + ' 天'); render();
  };

  /* 清空：记录和感想分开问，避免误删写下的文字 */
  const rs = document.querySelector('[data-reset]');
  if (rs) rs.onclick = () => {
    if (!confirm('清空所有打卡记录？（周计划会保留）')) return;
    logs = {}; save(K_LOGS, logs);
    /* 打卡记录清掉了，但感想是手写内容，单独再确认一次 */
    if (Object.keys(diary).length){
      if (confirm('你还有 ' + Object.keys(diary).length + ' 篇每日感想。\n要连感想一起清空吗？\n\n点「取消」= 保留感想（推荐）')) {
        diary = {}; save(K_DIARY, diary); toast('记录和感想都已清空');
      } else {
        toast('已清空打卡记录，感想保留');
      }
    } else {
      toast('已清空');
    }
    render();
  };
}

/* ---------- 面板按钮 ---------- */
$('#shCancel').onclick = closeSheet;
$('#mask').onclick     = closeAllSheets;
$('#shClear').onclick  = () => { $('#shText').value = ''; $('#shText').focus(); };
$('#shSave').onclick   = () => {
  const v = $('#shText').value.trim();
  const fn = sheetSave;
  closeSheet();
  if (fn) fn(v);
};

$('#nsCancel').onclick = closeNameSheet;
$('#nsOk').onclick     = () => {
  const v = $('#nsInput').value.trim();
  const fn = nameSave;
  closeNameSheet();
  if (fn) fn(v);
};
/* 回车即保存，手机上顺手 */
$('#nsInput').addEventListener('keydown', e => {
  if (e.key === 'Enter'){ e.preventDefault(); $('#nsOk').click(); }
});

render();

/* ---------- PWA：注册 Service Worker，实现离线可用 ----------
   file:// 下浏览器不允许注册 SW，所以用 catch 兜住，失败也不影响使用。
   页面走「网络优先」，联网打开会自动更新，改完不用做额外操作。 */
if ('serviceWorker' in navigator && location.protocol !== 'file:'){
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => {
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller){
            toast('有新版本，下次打开生效');
          }
        });
      });
    }).catch(() => {});
  });
}
</script>
</body>
